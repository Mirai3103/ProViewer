[package]
name = "codec-bench"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# libjpeg-turbo candidate, cross-built from source with CMake (scripts/device-run.ps1 -Features turbo).
turbo = ["dep:turbojpeg"]

[dependencies]
gen-corpus = { path = "../gen-corpus" }
jpeg-encoder = { workspace = true }
zune-jpeg = { workspace = true }
zune-core = { workspace = true }
# jpeg-decoder is pinned with default-features = false in the workspace (no rayon): every candidate decodes on one thread, like the engine's workers.
jpeg-decoder = { workspace = true }
turbojpeg = { workspace = true, optional = true }
